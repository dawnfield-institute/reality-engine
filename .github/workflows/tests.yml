name: Tests

# The repository's first CI. Before this, nothing ran on push, and the only local
# gate (pytest.ini) pointed at tests/v2 — the middle of three engine generations.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: v3 + v2 (shipping config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CPU wheels only — CUDA builds are ~2GB and nothing here needs a GPU to test.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q

  fracton-integration:
    name: with fracton
    runs-on: ubuntu-latest
    # reality-engine imports fracton behind try/except fallbacks, so the main job above
    # exercises only the fallback path. This job runs the same suite with fracton
    # actually present — the configuration that was broken and unnoticed for months
    # precisely because nobody ran it.
    #
    # It is a full gate, not informational. It briefly pinned an expected-failure count
    # of 15 while the PACValidator mismatch stood; that is now fixed, so it must be
    # green like any other job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: dawnfield-institute/fracton
          path: _fracton

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests with fracton on the path
        run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}/_fracton
