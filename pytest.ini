[pytest]
# v3 is the canonical engine (src/v3/). v1 and v2 are in archive/ and are not run.
#
# This previously read `testpaths = tests/v2`, which collected only the middle
# generation: tests/v3 was never run, and its 15 fracton-integration failures went
# unseen for months while the suite reported green. A gate pointed at the wrong
# generation is worse than no gate — it reports success about something nobody is
# working on.
testpaths = tests/v3

norecursedirs = archive spikes .git

filterwarnings =
    ignore::DeprecationWarning
