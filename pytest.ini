[pytest]
# v3 is the canonical engine (src/v3/). v2 (src/) is retained until archived.
#
# This previously read `testpaths = tests/v2`, which collected only the middle
# generation: tests/v3 was never run, and its 15 fracton-integration failures went
# unseen for months while the suite reported green. A gate pointed at the wrong
# generation is worse than no gate — it reports success about something nobody is
# working on.
testpaths = tests/v3 tests/v2

# tests/ root holds v1-era tests that fail at collection (test_thermodynamics.py).
# They are excluded rather than deleted; they move to archive/ with v1.
norecursedirs = archive spikes proof_of_concepts .git

filterwarnings =
    ignore::DeprecationWarning
