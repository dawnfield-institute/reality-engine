schema_version: '2.1'
directory_name: poc_03_local_enforces_global
title: 'POC-03 (v4): Does local enforcement produce global conservation?'
description: >
  POC-01 found the global ledger an exact invariant under perturbation (R=1.000); POC-02
  found local E/I balance durable (R=0.028). The reading is that the global ledger is where
  redistribution is tallied while local balance is where it is enforced, making conservation
  emergent rather than imposed. That explains both results but forbids nothing. This turns
  it into a falsifiable claim - if local enforcement produces global conservation, weaker
  local durability should accompany larger global drift across parameter space. Both
  quantities are taken from the same runs, global drift from the unperturbed reference twin.
status: active
era: era4-milestone-stack-2026q2
pillar: PAC
hypothesis: >
  Local balance recovery ratio R and global ledger drift rate are positively correlated
  across parameter settings (Spearman rho > 0.6).
falsification: >
  If rho <= 0.3, including any negative value, local durability does not predict global
  conservation - the two are independent properties of the engine and the emergence reading
  gets no support here.
validation_type: computational
