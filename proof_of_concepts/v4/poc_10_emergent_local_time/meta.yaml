schema_version: '2.1'
directory_name: poc_10_emergent_local_time
title: 'POC-10 (v4): Emergent local time — a clock rate set by the local collapse budget'
description: >
  If a quantum collapse event IS a tick, the local framerate is set by how much collapse a
  neighbourhood can still do. Mass is spent potential, so a mass-dense region has little budget
  left and ticks slowly - which makes gravitational time dilation a consequence of PAC
  bookkeeping rather than something inserted. Nothing in the substrate knows about GR.

  This round adds a LocalTime operator to the v4 particle substrate (per-particle clock rate,
  per-particle proper time, neighbour diffusion of tau) and asks four questions of it: does the
  clock field trace the web, is it dilation or is it density relabelled, does time flow ALONG
  the filaments like a current, and does structure character depend on scale.

  It also produced the round's most reusable output, which was not planned: an instrument that
  distinguishes a process that has ENDED from one that has MOVED to another scale.
status: active
era: era4-milestone-stack-2026q2
pillar: SEC
hypothesis: >
  A clock rate derived only from LOCAL neighbour counts will reproduce gravitational-dilation
  behaviour against the long-range gravitational potential, which the substrate never computes;
  and the clock field will propagate along the filament network the way a current runs through
  a conductor.
falsification: >
  If the clock field's agreement with the long-range potential vanishes once its own local
  input is regressed out, emergent time is local density relabelled and nothing has emerged.
  If transport through a web is indistinguishable from transport through an unstructured
  control at matched degree, the conduction picture does not hold.
  RESOLVED 2026-08-17: the first condition is NOT met (the agreement survives at nu > 0 and
  vanishes only at nu = 0, as it should). The second WAS apparently met by exp_03 and that was
  a measurement failure - at matched DEGREE rather than matched ball radius, the web separates
  from the control at +9.14 sigma.
validation_type: computational
result: >
  VISCOSITY IS THE MECHANISM, AND IT IS NOT A STABILISER. With tau diffusion off (nu = 0) the
  partial correlation between tau and the long-range Newtonian potential, controlling for tau's
  own exact input, is -0.009 +-0.04 - EXACTLY ZERO. Emergent time is then its own local input
  wearing a different name. Switch diffusion on and it rises monotonically: nu 0.3 -> +0.240,
  nu 0.6 -> +0.322. Neighbour diffusion, iterated, is what carries clock information past r0
  and makes time a FIELD rather than a per-particle label. The nu = 0 null is the internal
  control that makes the rest meaningful, and the channel was named in advance.

  THE FORM IS WRONG FOR GR. Fitting tau against Phi_newton: quadratic R2 0.908, GR weak-field
  sqrt(1 + 2 Phi) R2 0.802, linear R2 0.749. If this were gravitational dilation the sqrt form
  should win. A clock field that responds non-locally to the potential: yes. Dilation in the
  GR sense: NOT demonstrated.

  REMAINING BUDGET BEATS COLLAPSE RATE. The two candidate framerate sources were left open by
  the corpus and separate cleanly on topology: "potential" (tau ~ 1/(1+kappa*delta)) puts 89%
  of slow clocks on filaments and 11% on boundaries, corr(tau, delta) = -0.673; "rate"
  (tau ~ 1/(1+kappa*|d delta/dt|)) gives 56/37 and -0.089.

  TIME DOES CONDUCT ALONG THE WEB - exp_03's null was a MEASUREMENT FAILURE, corrected by
  exp_06 on 2026-08-17. exp_03 coupled particles by DISTANCE BALL, which entangles "how much
  matter is nearby" with "how it is connected" in the definition of the operator: in the web a
  ball held ~798 neighbours against 116 in the control at the same n and box. It could not have
  detected conduction either way.

  On a k-NEAREST-NEIGHBOUR graph, degree is bounded (7.37 web vs 7.14 control, CV 0.163 vs
  0.170), so a dense region earns no extra conductance for being dense and anything surviving is
  topology. Effective resistance from a source - a steady-state linear solve, no threshold, no
  step count - against local density within fixed Euclidean shells, topology-only edges, 5 seeds:
  k=4 gives web +0.410 vs control -0.003 (+5.21 sigma); k=6 gives +0.422 vs -0.022 (+6.22 sigma);
  k=10 gives +0.442 vs -0.028 (+9.14 sigma). The EFFECT SIZE IS K-INDEPENDENT at 0.41-0.44, with
  significance rising only because more edges means less noise. Stronger with length removed than
  with conductance ~ 1/length (+0.297, +2.57 sigma), so not an edge-length artifact either.
  Dense particles are better connected than their Euclidean separation implies.

  AND IT IS A PARALLEL-PATH EFFECT, NOT A SHORTEST-PATH ONE. The geodesic arm - shortest PHYSICAL
  path length along the same graph - shows nothing: +0.68, +0.02, -1.64 sigma across k, scattering
  around zero. Effective resistance and shortest path diverge only through redundancy: a filament
  conducts not because it is a short wire but because it is a thick bundle of parallel ones.

  BUT THE CLOCK FIELD DOES NOT EXPLOIT IT (exp_07). exp_06 measured the NETWORK's conduction;
  whether tau uses it is separate, and took three designs. Ball-vs-knn coupling is confounded by
  KERNEL SIZE - tau's non-local content is monotone and roughly logarithmic in coupling degree
  (7.6 -> +0.085, 58.8 -> +0.275, ball 237 -> +0.399). Web-vs-uniform is confounded by
  CONTROL-VARIABLE VARIANCE - partial correlation is not comparable across arms whose control
  variable has different spread, and it scored the control HIGHER at -9.31 sigma.

  The method that works is the corpus's own (dawn-field-theory
  experiments/studies/euclidean_distance_validation, experiment_25): a DEGREE-PRESERVING EDGE
  SHUFFLE, holding particles, positions, density, delta and its variance, degree, edge count and
  kernel size fixed while changing only WHICH particles are connected. Both confounds become
  impossible by construction and no partial correlation is needed. Degree preservation asserted
  every run. Web: real +0.708, shuffled +0.091, GAP +0.617, z +23.5. Uniform: real +0.783,
  shuffled +0.095, GAP +0.688, z +41.6. Rewiring destroys 87% of tau's agreement with the
  long-range potential - but the shuffle removes the web's topology AND spatial locality
  together, so the same null inside a uniform box separates them. EXCESS = -0.071 (-4.27 sigma):
  the web's gap is SMALLER. TAU FOLLOWS SPATIAL LOCALITY AND THE WEB ADDS NOTHING ON TOP.

  Not a contradiction with exp_06 - different questions, both hold. The NETWORK conducts
  preferentially through dense regions; the CLOCK FIELD's agreement with Phi does not exploit
  that, needing only that the coupling be local. Either the mean-relaxation form washes the
  advantage out (testable with the conduction Laplacian), or Phi is the WRONG OBSERVABLE because
  a smooth long-range potential may not care about network structure. The second is untested.

  STILL OPEN: which Laplacian SEC viscosity actually is. The mean (random-walk) and conduction
  (unnormalised) forms predict opposite signs and the corpus never fixed the choice.

  STRUCTURE CHARACTER IS SCALE-DEPENDENT, AND THE ORGANISING SCALE MIGRATES. Hessian
  classification across a smoothing ladder: filaments peak at intermediate scale (58% at
  0.45 r0), nodes rise monotonically outward, voids dominate the small end. Across epochs the
  filament peak moves OUT (0.45 -> 0.64 r0) while small-scale void fraction grows 6.3% -> 25.3%
  -> 32.7%. Small scales evacuate as structure re-forms at larger ones.

  ENDED OR MOVED - A CALIBRATED DETECTOR. The web at t=450 reads RE-ENTERING at 2.34-2.43x a
  measured destruction control, where a frozen system reads 0.00x and a dissolving one 0.97-1.03x,
  both TERMINATED. The discriminating quantity is cross-scale EXCHANGE of collapse order:
  a dissolving system moves every scale the same direction, a re-entering one moves scales
  against each other.
notes: >
  A TAU CLAIM WAS RETRACTED MID-ROUND. tau's character spectrum is sheet-dominated where matter
  is filament-dominated, at every scale and epoch, and this was briefly written up as "the clock
  field sits one axis of collapse behind matter". A control killed it: applying tau's FORMULA
  (1/(1+kappa*delta)) to the same rho with no viscosity and no evolution reproduces the
  inversion (30.5% filament / 58.6% sheet against matter's 61.5/29.9). The inversion is the
  nonlinear transform, not the physics. What survives is second-order: |tau - algebra| = 0.136
  against a 0.04-0.07 reference, with tau sitting BETWEEN matter and the pure algebra.

  exp_03'S OPERATOR COULD NOT ANSWER ITS OWN QUESTION and its null was reported as a result
  anyway. exp_06 redoes it on a bounded-degree graph and finds the opposite at +9.14 sigma. Three
  MORE observables failed in exp_06 alone before one worked: hop count (edge length scales with
  local spacing, so crossing dense material costs more hops for purely geometric reasons);
  explicit time-stepping (conductance weights make the network stiff, so the stable step collapses
  and it returned all-NaN, which nearly got read as "nothing arrives"); and the length-weighting
  question itself, settled by an unweighted run that made the effect STRONGER.

  THREE OBSERVABLES FAILED BEFORE ONE WORKED, in the transport experiment. (1) Per-particle
  AMPLITUDE is degree-confounded: relaxation shares a value among neighbours, so a dense
  filament divides the same signal over ~7x more particles and amplitude falls with density
  whether or not filaments channel. (2) ARRIVAL TIME was claimed to be dilution-free and is not
  - crossing a threshold still depends on amplitude. (3) The first run was measured on a
  SATURATED graph: at r0/box = 1/6 each particle neighbours ~800 of 6000, the graph diameter is
  ~2 hops, arrival fraction was 1.00 everywhere and there was no front to measure. Only the
  fourth version, with a uniform control that could return zero, meant anything.

  THE CLOCK COUPLING RADIUS MUST BE SEPARATE FROM THE FORCE RADIUS. Tying tau diffusion to r0
  is what produced the saturated graph. Local time only has propagation structure when its
  coupling is short-ranged against the web; exp_03 takes --diffuse-radius for this.

  THE DETECTOR'S CALIBRATION ONCE PASSED WHILE BROKEN. An intermediate version defaulted every
  verdict to TERMINATED through a NaN path, so both controls "passed" for reasons unrelated to
  what they guard. The calibration now also requires that the reference SEPARATED the web from
  the controls. A check that can only ever say PASS guards nothing.

  KNOWN SENSITIVITY. exp_05 needs enough scales and resolution to discriminate: at n=8000,
  res=32, 6 scales it reports 2.34x and PASS; at n=3000, res=24, 3 scales it reports 0.79x and
  correctly refuses to answer (CALIBRATION FAIL) rather than guessing.

  ONE MODEL OF DEATH. The detector's control set contains progressive smoothing only. A system
  that dies by freezing mid-structure, or by fragmenting without smoothing, is not represented,
  and each is a different way it could be fooled.
